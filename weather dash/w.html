<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Savad's Weather Dashboard</title>

    <link rel="stylesheet" href="w.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>🌤️ Weather Dashboard</h1>

            <button id="themeBtn">
                🌙 Dark
            </button>
        </header>


        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </section>


        <!-- Loading -->
        <div id="loading" class="loading hidden">
            Loading...
        </div>


        <!-- Error -->
        <div id="errorMsg" class="error hidden"></div>


        <!-- Current Weather -->
        <section
            id="weatherCard"
            class="weather-card hidden"
        >
        </section>


        <!-- Forecast -->
        <section
            id="forecastSection"
            class="forecast-section hidden"
        >

            <h2>5-Day Forecast</h2>

            <div id="forecastContainer">
            </div>

        </section>


        <!-- Favorites -->
        <section class="favorites-section">

            <h2>⭐ Favorites</h2>

            <div id="favoritesList">
            </div>

        </section>

    </div>


    <script src="w.js"></script>

</body>

</html>
